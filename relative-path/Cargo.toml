[package]
name = "relative-path"
version = "2.0.3"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2021"
rust-version = "1.85"
description = "Portable, relative paths for Rust."
documentation = "https://docs.rs/relative-path"
readme = "README.md"
repository = "https://github.com/udoprog/relative-path"
license = "MIT OR Apache-2.0"
keywords = ["path"]
categories = ["filesystem"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(relative_path_docsrs)'] }

[features]
default = ["std", "alloc"]
alloc = ["serde_core?/alloc"]
std = []
serde = ["dep:serde_core" ]
musli02 = ["dep:musli-core02"]

[dependencies]
serde_core = { version = "1.0.160", optional = true, default-features = false }
musli-core02 = { package = "musli-core", version = "0.2.0", optional = true, default-features = false }

[dev-dependencies]
anyhow = "1.0.76"
foldhash = "0.2.0"
musli = { version = "0.2.0", features = ["storage", "json"] }
serde = { version = "1.0.160", features = ["derive"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "relative_path_docsrs"]
